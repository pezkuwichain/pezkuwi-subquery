name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run npm audit
        run: yarn npm audit --all --recursive || true

      - name: Check for critical vulnerabilities
        run: |
          CRITICAL=$(yarn npm audit --all --recursive --json 2>/dev/null | jq '[.advisories // {} | to_entries[] | select(.value.severity == "critical")] | length' 2>/dev/null || echo "0")
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Found $CRITICAL critical vulnerabilities"
            exit 1
          fi

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          # The light client is an optional dependency of @pezkuwi/rpc-provider,
          # so it is listed in the bots' lockfiles, but their images are built
          # with --omit=optional and never contain it (checked in ci.yml, bots).
          # TruffleHog (AGPL-3.0) is the secret scanner this workflow runs; it
          # executes in CI and is never shipped, served or distributed.
          # The @subql packages make up the SubQuery indexer that runs the
          # mapping; the mapping imports only their types, so the bundle this
          # repo builds carries none of their code (checked in ci.yml, build).
          allow-dependencies-licenses: >-
            pkg:npm/@bizinikiwi/connect,
            pkg:npm/@bizinikiwi/connect-extension-protocol,
            pkg:npm/@bizinikiwi/connect-known-chains,
            pkg:npm/@subql/cli,
            pkg:npm/@subql/common,
            pkg:npm/@subql/common-substrate,
            pkg:npm/@subql/node,
            pkg:npm/@subql/node-core,
            pkg:npm/@subql/testing,
            pkg:npm/@subql/types,
            pkg:npm/@subql/types-core,
            pkg:npm/@subql/utils,
            pkg:githubactions/trufflesecurity/trufflehog

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified
